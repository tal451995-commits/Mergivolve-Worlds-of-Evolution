<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6ec9ed">
  <meta name="description" content="Mergivolve 3D animation engine prototype">
  <title>Mergivolve — 3D World Lab</title>
  <style>
    :root{color-scheme:dark;--ink:#193d34;--glass:#14392fcf;--gold:#f8dc83;--mint:#bce9bc}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6ec9ed;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{overscroll-behavior:none}
    #scene-root{position:fixed;inset:0}
    #scene-root canvas{display:block;width:100%;height:100%;touch-action:none}
    .hud{position:fixed;z-index:3;pointer-events:none;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
    .top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;direction:rtl}
    .brand-card,.tips-card,.back-link,.hud-chip{background:var(--glass);color:#fffdf2;border:1px solid #ffffff30;box-shadow:0 8px 26px #173b3530;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .brand-card{border-radius:18px;padding:11px 14px;max-width:min(72vw,390px)}
    .eyebrow{font-weight:900;color:var(--gold);font-size:10px;letter-spacing:1.4px}
    h1{font-size:clamp(18px,4.2vw,25px);line-height:1.1;margin:5px 0 4px;font-weight:950}
    .subtitle{font-size:11px;line-height:1.4;color:#e1f8e8}
    .back-link{pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:14px;padding:10px 12px;text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}
    .back-link:active{transform:translateY(1px)}
    .bottom-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;direction:rtl}
    .tips-card{border-radius:16px;padding:10px 12px;font-size:11px;line-height:1.65;max-width:min(66vw,380px)}
    .tips-card strong{color:var(--gold)}
    .control-zone{display:flex;align-items:flex-end;gap:10px;pointer-events:auto}
    #joystick{position:relative;width:112px;height:112px;flex:0 0 auto;border-radius:50%;border:1px solid #ffffff60;background:#14392f66;box-shadow:inset 0 0 0 8px #ffffff10,0 8px 26px #123a3330;touch-action:none;user-select:none}
    #joystick:before,#joystick:after{content:"";position:absolute;left:50%;top:50%;background:#ffffff26;transform:translate(-50%,-50%);pointer-events:none}
    #joystick:before{width:1px;height:70%}#joystick:after{height:1px;width:70%}
    #stick{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#f9e9a5,#d2f0af);box-shadow:0 4px 0 #71956a,0 4px 14px #102d2855;transform:translate(-50%,-50%);pointer-events:none}
    .hud-chip{border-radius:12px;padding:8px 10px;font-size:10px;font-weight:800;color:#ecffe9;margin-top:8px}
    #status{min-height:15px}
    @media(max-width:560px){
      .hud{padding-left:9px;padding-right:9px}
      .brand-card{padding:9px 11px;max-width:72vw}
      .subtitle{max-width:225px}
      .back-link{padding:9px 10px;font-size:11px}
      .bottom-row{align-items:flex-end}
      .tips-card{font-size:10px;max-width:calc(100vw - 138px);padding:8px 9px}
      #joystick{width:100px;height:100px}
    }
    @media(max-height:500px){
      .brand-card{padding:7px 10px}.subtitle{display:none}
      .tips-card{line-height:1.35}.bottom-row{align-items:center}
      #joystick{width:82px;height:82px}#stick{width:36px;height:36px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
    
html.embedded .back-link {
  display: none !important;
}

  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="scene-root" aria-label="עולם תלת־ממדי של Mergivolve"></div>
  <div class="hud">
    <div class="top-row">
      <div class="brand-card">
        <div class="eyebrow">MERGIVOLVE · ANIMATION LAB</div>
        <h1>היער מתעורר לחיים</h1>
        <div class="subtitle">אב־טיפוס תלת־ממדי נפרד — המיזוג והשמירות של המשחק הראשי לא משתנים.</div>
      </div>
      <a class="back-link" href="./merge-game.html" aria-label="חזרה למשחק המיזוג">↩ חזרה למשחק</a>
    </div>
    <div class="bottom-row">
      <div>
        <div class="tips-card">
          <strong>איך זזים?</strong><br>
          מחשב: WASD או החצים · עכבר לסיבוב המצלמה<br>
          טלפון: הג׳ויסטיק · גרירה על המסך לסיבוב המצלמה
          <div id="status" role="status">טוען את העולם…</div>
        </div>
        <div class="hud-chip">🌿 3D WORLD · PREVIEW</div>
      </div>
      <div class="control-zone">
        <div id="joystick" aria-label="ג'ויסטיק וירטואלי" role="application"><div id="stick"></div></div>
      </div>
    </div>
  </div>
  
<script>
  if (new URLSearchParams(window.location.search).get('embedded') === '1') {
    document.documentElement.classList.add('embedded');
  }
</script>

  <script type="module" src="./assets/animation/mergivolve-world.js"></script>
</body>
</html>
