<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#183d31"><title>Mergivolve — קטלוג תמונות</title>
<style>
:root{--ink:#20382b;--muted:#65766b;--line:#dce5dc;--bg:#f5f7f1;--green:#234e3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#f5f7f1f2;padding:14px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.pill{background:#e5eee4;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls input,.controls select,button{font:inherit;padding:11px;border:1px solid #ccd9cd;border-radius:11px;background:white;min-width:0}button.primary{background:var(--green);color:white;font-weight:700}.actions{display:flex;gap:8px;margin-top:8px}.actions button{flex:1}main{padding:12px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:14px;padding:9px;overflow:hidden}.preview{aspect-ratio:1;background-color:#edf1eb;background-image:linear-gradient(45deg,#dfe5dd 25%,transparent 25%),linear-gradient(-45deg,#dfe5dd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#dfe5dd 75%),linear-gradient(-45deg,transparent 75%,#dfe5dd 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;border-radius:9px;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.empty{color:#7a887e;text-align:center;font-size:12px;padding:8px}.name{font-weight:800;margin:7px 0 2px;overflow-wrap:anywhere}.meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.card select{width:100%;margin-top:8px;padding:8px;font-size:12px;border:1px solid var(--line);border-radius:9px}#status{padding:16px;text-align:center;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.controls{grid-template-columns:2fr 1fr 1fr 1fr}}
</style></head><body><header><h1>🧩 קטלוג תמונות Mergivolve</h1><div class="sub">כל מיני הקטלוג מול קובצי ה־PNG במאגר. אפשר לבחור תמונה לכל מין ולייצא מיפוי לבדיקה. זה לא משנה את המשחק עד שמחברים את המיפוי לקוד.</div><div id="stats" class="stats">טוען נתונים…</div><div class="controls"><input id="search" placeholder="חיפוש מפלצת או קובץ…"><select id="filter"><option value="all">כל המינים</option><option value="missing">חסרה התאמה מדויקת</option><option value="matched">יש התאמה מדויקת</option></select><select id="kind"><option value="species">מיני הקטלוג</option><option value="files">כל קובצי PNG</option></select><select id="rarity"><option value="all">כל הנדירויות</option></select></div><div class="actions"><button id="export" class="primary">ייצוא מיפוי JSON</button><button id="reset">איפוס בחירות</button></div></header><main><div id="status">טוען את הקטלוג ואת התמונות מ־GitHub…</div><div id="grid" class="grid"></div></main>
<script src="./assets/creatures/species-catalog.js"></script><script src="./assets/creatures/species-catalog-expansion.js"></script><script>
(()=>{'use strict';const OWNER='tal451995-commits',REPO='Mergivolve-Worlds-of-Evolution',API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`,RAW=`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/`, $=id=>document.getElementById(id);let species=[],files=[],choices={};const slug=s=>String(s||'').normalize('NFKD').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');async function get(url){const r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API '+r.status);return r.json()}async function dir(path){let out=[];for(let p=1;p<=10;p++){const d=await get(API+path+'?ref=main&per_page=100&page='+p);if(!Array.isArray(d))break;out.push(...d);if(d.length<100)break}return out}function exact(s){const keys=[s.id,s.nameEn,s.nameHe].map(slug);return files.find(f=>keys.includes(slug(f.name.replace(/\.png$/i,'')))||keys.includes(slug(f.path.split('/').pop().replace(/\.png$/i,''))))||null}function url(f){return f?(f.download_url||RAW+f.path.split('/').map(encodeURIComponent).join('/')):''}function stats(){const matched=species.filter(exact).length;const a=[['מיני קטלוג',species.length],['התאמות מדויקות',matched],['חסרות התאמה מדויקת',species.length-matched],['קובצי PNG',files.length],['בחירות ידניות',Object.values(choices).filter(Boolean).length]];$('stats').replaceChildren(...a.map(([k,v])=>{const e=document.createElement('span');e.className='pill';e.textContent=k+': '+v;return e}))}function render(){const q=$('search').value.trim().toLowerCase(),filter=$('filter').value,kind=$('kind').value,rarity=$('rarity').value,g=$('grid');g.replaceChildren();if(kind==='files'){const list=files.filter(f=>(f.name+' '+f.path).toLowerCase().includes(q));for(const f of list){const c=document.createElement('article');c.className='card';const p=document.createElement('div');p.className='preview';const im=document.createElement('img');im.loading='lazy';im.src=url(f);im.alt=f.name;p.append(im);const n=document.createElement('div');n.className='name';n.textContent=f.name;const m=document.createElement('div');m.className='meta';m.textContent=f.path;c.append(p,n,m);g.append(c)}$('status').textContent=`מוצגים ${list.length} מתוך ${files.length} קובצי PNG`;return}const list=species.filter(s=>{const f=choices[s.id]?files.find(x=>x.path===choices[s.id]):exact(s),has=!!f;return(filter==='all'||filter==='missing'&&!has||filter==='matched'&&has)&&(rarity==='all'||s.rarity===rarity)&&(!q||[s.id,s.nameEn,s.nameHe,s.category,s.rarity].join(' ').toLowerCase().includes(q))});for(const s of list){const auto=exact(s),chosen=choices[s.id]?files.find(x=>x.path===choices[s.id]):auto,c=document.createElement('article');c.className='card';const p=document.createElement('div');p.className='preview';if(chosen){const im=document.createElement('img');im.loading='lazy';im.src=url(chosen);im.alt=s.nameEn||s.id;p.append(im)}else{const e=document.createElement('div');e.className='empty';e.textContent='אין תמונה משויכת';p.append(e)}const n=document.createElement('div');n.className='name';n.textContent=(s.nameHe?s.nameHe+' · ':'')+(s.nameEn||s.id);const m=document.createElement('div');m.className='meta';m.textContent=`ID: ${s.id} · ${s.rarity||'ללא נדירות'} · ${s.category||'ללא קטגוריה'}`;const sel=document.createElement('select');sel.setAttribute('aria-label','תמונה עבור '+s.id);[['','— ללא תמונה / התאמה אוטומטית —'],...files.map(f=>[f.path,f.name+' ('+f.path+')'])].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.append(o)});sel.value=choices[s.id]||(auto?auto.path:'');sel.addEventListener('change',()=>{if(sel.value)choices[s.id]=sel.value;else delete choices[s.id];stats();render()});c.append(p,n,m,sel);g.append(c)}$('status').textContent=`מוצגים ${list.length} מתוך ${species.length} מיני קטלוג`}function exportMap(){const result={schemaVersion:1,generatedAt:new Date().toISOString(),note:'Review before connecting to gameplay. Exact matches are normalized ID/name matches; manual selections are user choices.',species:{}};for(const s of species){const a=exact(s);result.species[s.id]={id:s.id,nameEn:s.nameEn||'',nameHe:s.nameHe||'',image:choices[s.id]||a?.path||null,matchType:choices[s.id]?'manual':a?'exact':'missing'}}const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='mergivolve-image-mapping.json';a.click();URL.revokeObjectURL(u)}async function start(){try{species=Object.values(window.MERGIVOLVE_SPECIES||{}).sort((a,b)=>String(a.nameEn||a.id).localeCompare(String(b.nameEn||b.id)));if(!species.length)throw Error('קטלוג המינים לא נטען');const lists=await Promise.all([dir(''),dir('assets/creatures')]),seen=new Set();files=lists.flat().filter(f=>f.type==='file'&&/\.png$/i.test(f.name)&&f.download_url&&!seen.has(f.path)&&seen.add(f.path)).sort((a,b)=>a.path.localeCompare(b.path));[...new Set(species.map(s=>s.rarity).filter(Boolean))].sort().forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;$('rarity').append(o)});stats();render()}catch(e){$('status').textContent='שגיאה: '+e.message+'. פתח דרך GitHub Pages וחיבור אינטרנט.';console.error(e)}}['search','filter','kind','rarity'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('export').addEventListener('click',exportMap);$('reset').addEventListener('click',()=>{choices={};stats();render()});start()})();
</script></body></html>
